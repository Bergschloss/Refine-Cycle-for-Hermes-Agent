name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The point of the matrix is the OS, not the tests. The longest-lived bug in
    # this project was a hardcoded ~/.hermes that made the plugin read nothing on
    # Windows, silently. A green run on one OS proves nothing about the other.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # No install step: the plugin and its tests are standard library only.
      # run_tests.py puts the repo root on sys.path itself, so it runs as-is.
      #
      # Test-count floor. On 2026-08-24 commit 753375f removed the suite entry
      # point and deleted TraceContractTests; the suite then exited 0 having
      # run ZERO tests and CI reported green. Three commits shipped in that
      # state before 66d30bb caught it. `python tests/run_tests.py` returning 0
      # is the only CI signal, and a suite that runs nothing returns 0, so a
      # dead entry point must be a hard failure.
      #
      # The floor is deliberately 600, NOT today's count (666 here, 660 in the
      # other checkout). A floor tied to the current count turns every
      # intentional test removal into a CI failure and invites raising the floor
      # to make it pass. 600 catches catastrophic loss (a dead entry point
      # yields 0) while leaving normal test churn alone. This number guards the
      # suite, so do not "tidy" it away.
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          python tests/run_tests.py 2>&1 | tee suite.log
          ran=$(grep -oE '^Ran [0-9]+ tests' suite.log | grep -oE '[0-9]+' || echo 0)
          floor=600
          echo "ran=$ran floor=$floor"
          if [ "$ran" -lt "$floor" ]; then
            echo "::error::Suite floor breached: ran $ran tests, floor is $floor."
            exit 1
          fi
        env:
          PYTHONIOENCODING: utf-8
